Dependencies:
- 'on': ['Linux', 'FreeBSD', 'Windows']
  'require':
    'frameworks/extra-cmake-modules': 'Frameworks/6.24'
    'frameworks/kcoreaddons': 'Frameworks/6.24'
    'frameworks/kwindowsystem': 'Frameworks/6.24'
    'frameworks/ki18n': 'Frameworks/6.24'
    'frameworks/kcrash': 'Frameworks/6.24'
    'pim/akonadi' : '@same'
    'pim/akonadi-calendar' : '@same'
    'pim/kontactinterface' : '@same'

- 'on': ['Linux', 'FreeBSD']
  'require':
    'frameworks/krunner': 'Frameworks/6.24'

Options:
  ctest-arguments: '--repeat until-pass:3'
  use-ccache: True
  require-passing-tests-on: ['Linux']
  gcovr-arguments: '--filter src/'

